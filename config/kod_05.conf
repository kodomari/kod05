# --------------------------------
# kod_05.conf
# 共通設定
# --------------------------------

# ZMK基本設定
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT=y

# 左右リンクをBLEから有線UART1(PD_1=RX1/PD_2=TX1)に変更。
# ZMK_SPLIT_BLEはCONFIG_ZMK_BLE=yに連動してデフォルトyになるため明示的にnにする。
# ZMK_SPLIT_WIREDはdevicetreeにzmk,wired-splitノードがあれば自動でyになるはずだが、
# 念のため明示しておく。BLE自体(ホストPCとの接続用)はCONFIG_ZMK_BLE=yのまま維持。
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# BLE接続数
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# ロータリーエンコーダー（左手）
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_KEYMAP_SENSORS=y

# マウス機能（必須）⭐⭐⭐
CONFIG_ZMK_POINTING=y

# 省電力設定
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Split BLE の遅延軽減
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Split BLEキュー設定は、SPLIT_BLE=nにしたため削除(有効なままだとKconfigの
# 依存関係を満たさず警告が出るため)。有線split用のキューサイズ調整が必要な場合は
# CONFIG_ZMK_SPLIT_WIRED_CMD_BUFFER_ITEMS / EVENT_BUFFER_ITEMS を使う。

CONFIG_ZMK_SPLIT_WIRED_UART_MODE_ASYNC=n
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
