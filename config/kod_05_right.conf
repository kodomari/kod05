# --------------------------------
# kod_05_right.conf
# 右側 = central + PS/2 TrackPoint
# --------------------------------

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# デバッグのため、USB CDC-ACM経由でログを見られるようにする。
# 通常運用時は無効化推奨(消費電力・レイテンシへの影響があるため)。
CONFIG_LOG=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_DEFAULT_LEVEL=4

CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y

CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE_ERROR_MITIGATION=n

CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Prospector(status advertisement)は、周辺機バッテリー取得(CONFIG_ZMK_SPLIT_BLE_
# CENTRAL_BATTERY_LEVEL_FETCHING)がBLE split前提の機能で、wired split(ZMK_SPLIT_BLE=n)
# だと依存を満たせずビルドエラーになる(prospector-zmk-module側がwired splitを未対応)。
# 左手はもうバッテリを持たない設計でもあり、周辺機バッテリー表示自体が意味を持たなく
# なるため、一旦status advertisement自体を無効化する。将来Prospector側がwired split
# に対応したら復活を検討。
# CONFIG_ZMK_STATUS_ADVERTISEMENT=y
# CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="kod05"
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="RIGHT"
